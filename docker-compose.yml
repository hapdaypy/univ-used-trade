services:
  trade-db:
    image: postgres:16-alpine
    container_name: trade-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - trade-db-data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - trade-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  backend-api:
    build:
      context: ./backend
    container_name: backend-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@trade-db:5432/${DB_NAME}
    ports:
      - "8000:8000"
    depends_on:
      trade-db:
        condition: service_healthy
    networks:
      - trade-network

  chat-service:
    build:
      context: ./chat-service
    container_name: chat-service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@trade-db:5432/${DB_NAME}
    ports:
      - "8001:8000"
    depends_on:
      trade-db:
        condition: service_healthy
    networks:
      - trade-network

  frontend:
    build:
      context: ./frontend
    container_name: frontend
    restart: unless-stopped
    ports:
      - "5500:5500"
    depends_on:
      - backend-api
      - chat-service
    networks:
      - trade-network

volumes:
  trade-db-data:

networks:
  trade-network:
    driver: bridge
